version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mbs_user
      POSTGRES_PASSWORD: mbs_password
      POSTGRES_DB: mbs_sandbox
    networks:
      - mbs-net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - DATABASE_URL=postgresql://mbs_user:mbs_password@db:5432/mbs_sandbox
    networks:
      - mbs-net
    depends_on:
      - redis
      - db

  # Redis for celery/message broker
  redis:
    image: redis:7-alpine
    networks:
      - mbs-net

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    networks:
      - mbs-net
    depends_on:
      - backend

  # Go Collector Sandbox (Simulated)
  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    privileged: true 
    environment:
      - MBS_API_URL=http://backend:8000/api/v1/events
    networks:
      - mbs-isolated-net
      - mbs-net 
    depends_on:
      - backend

networks:
  mbs-net:
    driver: bridge
  mbs-isolated-net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
